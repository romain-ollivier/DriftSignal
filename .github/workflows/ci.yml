name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install backend dependencies
        run: |
          # Temporary one-run lockfile bootstrap; revert before review.
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "console.log('LOCKFILE_B64_BEGIN' + Buffer.from(require('fs').readFileSync('package-lock.json')).toString('base64') + 'LOCKFILE_B64_END')"
          npm ci

      - name: Install UI dependencies
        run: npm ci --prefix static/app

      - name: Run tests
        run: npm test

      - name: Validate synthetic B0/B1 benchmark report
        run: npm run benchmark:synthetic

      - name: Build Forge Custom UI
        run: npm run build
