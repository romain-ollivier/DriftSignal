modules:
  jira:issuePanel:
    - key: driftsignal-jira-panel
      title: DriftSignal - Documentation Integrity
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      resource: main
      resolver:
        function: resolver
      viewportSize: large
  confluence:globalPage:
    - key: driftsignal-confluence-page
      title: DriftSignal
      route: driftsignal
      resource: main
      resolver:
        function: resolver
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: static/app/dist
app:
  runtime:
    name: nodejs22.x
  compatibility:
    jira:
      required: true
    confluence:
      required: false
  id: ari:cloud:ecosystem::app/5bfd6737-ab99-44b5-a6ca-c93bc6d786e7
permissions:
  scopes:
    - read:jira-work
    - search:confluence
    - read:page:confluence
    - read:content.metadata:confluence
